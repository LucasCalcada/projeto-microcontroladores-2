<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Painel de Controle</h1>
    </div>
    <main>
      <div class="camera">
        <img src="/camera/stream" />
      </div>
      <div class="controls">
        <div class="card">
          <h1>Translação</h1>
          <div class="directions input-bg">
            <div id="joystick-indicator" class="indicator"></div>
          </div>
        </div>
        <div class="card">
          <h1>Rotação</h1>
          <div class="rotation input-bg">
            <div id="rotation-indicator" class="indicator"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script type="module" src="/static/input.js"></script>
  <script type="module" src="/static/display.js"></script>
  <script type="module" src="/static/script.js"></script>
</html>
